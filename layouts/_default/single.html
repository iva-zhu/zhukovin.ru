{{ define "title" -}}
{{ .Title }}
{{- end }}

{{ define "main" -}}
{{ .Content }}

{{ if .Params.tags }}
<hr style="margin-top: 3rem;">
<div style="margin-top: 2rem;">
  <strong>Теги:</strong>
  {{ range .Params.tags }}
    <a href="{{ "/tags/" | relURL }}{{ . | urlize }}/"
      style="display:inline-block;margin-right:.5rem;padding:.25rem .5rem;background:#1a1a1a;border-radius:4px;">
      #{{ . }}
    </a>
  {{ end }}
</div>
{{ end }}

{{- end }}
